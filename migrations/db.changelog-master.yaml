databaseChangeLog:
  # Корневой changelog. Новые миграции добавляются сюда отдельными include,
  # строго после предыдущих: порядок application определяется порядком include.
  # Файлы миграций — formatted SQL, лежат в changes.
  #
  # Порядок: сначала актуальная схема вакансий (001 и 009–015), затем схема резюме
  # (002), демо-данные (003) и доработки скоринга (004). Демо-вакансия из 003
  # использует колонки kind/skill_text, которые появляются только в 009.
  - include:
      file: changes/001-vacancy-schema.sql
      relativeToChangelogFile: true
  - include:
      file: changes/009-requirement-skills-and-kinds.sql
      relativeToChangelogFile: true
  - include:
      file: changes/010-skill-alias-and-seed.sql
      relativeToChangelogFile: true
  - include:
      file: changes/011-skill-kind-stat.sql
      relativeToChangelogFile: true
  - include:
      file: changes/012-seed-specializations.sql
      relativeToChangelogFile: true
  - include:
      file: changes/013-optional-level.sql
      relativeToChangelogFile: true
  - include:
      file: changes/014-seed-more-skills.sql
      relativeToChangelogFile: true
  - include:
      file: changes/015-specialization-it.sql
      relativeToChangelogFile: true
  - include:
      file: changes/002-resume-schema.sql
      relativeToChangelogFile: true
  - include:
      file: changes/003-demo-vacancy.sql
      relativeToChangelogFile: true
  - include:
      file: changes/004-scoring-integration.sql
