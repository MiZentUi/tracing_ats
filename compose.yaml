name: tracing-ats

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ats}
      POSTGRES_USER: ${POSTGRES_USER:-ats}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ats}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ats-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Отдельная джоба: накатывает схему и завершается.
  migrations:
    build:
      context: ./migrations
    image: ats-migrations:local
    environment:
      LIQUIBASE_COMMAND_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-ats}
      LIQUIBASE_COMMAND_USERNAME: ${POSTGRES_USER:-ats}
      LIQUIBASE_COMMAND_PASSWORD: ${POSTGRES_PASSWORD:-ats}
      LIQUIBASE_COMMAND_CHANGELOG_FILE: db.changelog-master.yaml
      LIQUIBASE_SEARCH_PATH: /liquibase/changelog
    command: ["update"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  minio:
    # MinIO community-образы удалены из Docker Hub/Quay в 2026.
    # pgsty/minio — API-совместимый форк; клиент — pgsty/mc.
    image: ${ATS_MINIO_IMAGE:-pgsty/minio:RELEASE.2026-08-04T00-00-00Z}
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${ATS_S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${ATS_S3_SECRET_KEY:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - ats-minio:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Создаёт бакет для оригиналов. Идемпотентно.
  minio-init:
    image: ${ATS_MINIO_MC_IMAGE:-pgsty/mc:RELEASE.2026-09-16T00-00-00Z}
    environment:
      MINIO_ROOT_USER: ${ATS_S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${ATS_S3_SECRET_KEY:-minioadmin}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        && mc mb --ignore-existing local/${ATS_S3_BUCKET:-ats-resumes}
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

  # Словарь навыков: нормализация, алиасы, очередь NEW. Своя схема в том же Postgres.
  dictionary-service:
    build:
      context: .
      dockerfile: dictionary-service/Dockerfile
    environment:
      DICTIONARY_GRPC_HOST: 0.0.0.0
      DICTIONARY_GRPC_PORT: 8084
      DICTIONARY_DATABASE_URL: postgresql://${POSTGRES_USER:-ats}:${POSTGRES_PASSWORD:-ats}@postgres:5432/${POSTGRES_DB:-ats}
      DICTIONARY_LOG_LEVEL: ${DICTIONARY_LOG_LEVEL:-INFO}
      DICTIONARY_STORE: postgres
      DICTIONARY_SERVICE_TOKEN: ${DICTIONARY_SERVICE_TOKEN:-}
    ports:
      - "${DICTIONARY_SERVICE_PORT:-8084}:8084"
    depends_on:
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    restart: unless-stopped

  # Stateless онлайн-ML: без БД, файлов и внешних источников.
  scoring-service:
    build:
      # Контекст — корень: образу нужны contracts/proto.
      context: .
      dockerfile: scoring-service/Dockerfile
    environment:
      SCORING_SERVICE_GRPC_HOST: 0.0.0.0
      SCORING_SERVICE_GRPC_PORT: 8082
      SCORING_SERVICE_LOG_LEVEL: ${SCORING_SERVICE_LOG_LEVEL:-INFO}
      # mock — без сети и ключей; openai — любой OpenAI-совместимый эндпоинт.
      SCORING_SERVICE_LLM_PROVIDER: ${SCORING_SERVICE_LLM_PROVIDER:-mock}
      SCORING_SERVICE_LLM_BASE_URL: ${SCORING_SERVICE_LLM_BASE_URL:-https://openrouter.ai/api/v1}
      SCORING_SERVICE_LLM_API_KEY: ${SCORING_SERVICE_LLM_API_KEY:-${OPENROUTER_API_KEY:-}}
      SCORING_SERVICE_LLM_MODEL: ${SCORING_SERVICE_LLM_MODEL:-}
      # Reasoning-модели тратят токены на reasoning: без запаса content приходит пустым.
      SCORING_SERVICE_LLM_MAX_OUTPUT_TOKENS: ${SCORING_SERVICE_LLM_MAX_OUTPUT_TOKENS:-4096}
      SCORING_SERVICE_LLM_TIMEOUT_SECONDS: ${SCORING_SERVICE_LLM_TIMEOUT_SECONDS:-30}
      SCORING_SERVICE_LLM_MAX_RETRIES: ${SCORING_SERVICE_LLM_MAX_RETRIES:-1}
      SCORING_SERVICE_DICTIONARY_ENABLED: ${SCORING_SERVICE_DICTIONARY_ENABLED:-true}
      SCORING_SERVICE_DICTIONARY_TARGET: ${SCORING_SERVICE_DICTIONARY_TARGET:-dictionary-service:8084}
      SCORING_SERVICE_DICTIONARY_DEADLINE_SECONDS: ${SCORING_SERVICE_DICTIONARY_DEADLINE_SECONDS:-2}
    ports:
      - "${SCORING_SERVICE_PORT:-8082}:8082"
    depends_on:
      dictionary-service:
        condition: service_started
    restart: unless-stopped

  # Детерминированная заглушка scoring-service для профиля mock-scoring.
  mock-scoring:
    profiles: ["mock-scoring"]
    build:
      # Контекст — корень: образу нужны contracts/proto.
      context: .
      dockerfile: infra/mock-scoring-service/Dockerfile
    environment:
      MOCK_SCORING_GRPC_HOST: 0.0.0.0
      MOCK_SCORING_GRPC_PORT: 8082
      MOCK_SCORING_LOG_LEVEL: ${MOCK_SCORING_LOG_LEVEL:-INFO}
    ports:
      - "${MOCK_SCORING_PORT:-8083}:8082"
    restart: unless-stopped

  # Заглушка LLM для CI и демо без ключа.
  mock-llm:
    build:
      context: ./infra/mock-llm
    ports:
      - "${MOCK_LLM_PORT:-8089}:8089"
    restart: unless-stopped

  # Заглушка hh.ru на Rust/Axum: публикация, подписка, резюме и вебхук.
  mock-hh:
    profiles: ["mock-hh"]
    build:
      context: ./infra/mock-hh
    environment:
      MOCK_HH_PORT: 8090
      MOCK_HH_WEBHOOK_URL: http://ats-service:8080/api/v1/integrations/hh/webhook?token=${ATS_HH_WEBHOOK_TOKEN:-mock-hh-token}
      MOCK_HH_EMPLOYER_ID: ${ATS_HH_EMPLOYER_ID:-999}
      MOCK_HH_PUBLIC_URL: ${MOCK_HH_PUBLIC_URL:-http://localhost:8090}
      MOCK_HH_STATE_FILE: /data/state.json
    volumes:
      - mock-hh-data:/data
    ports:
      - "${MOCK_HH_PORT:-8090}:8090"
    restart: unless-stopped

  # Один Java-сервис: вакансии, шаблон, резюме, PII, скрининг, рейтинг, отчёт.
  ats-service:
    build:
      context: .
      dockerfile: ats-service/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-ats}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-ats}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-ats}
      ATS_SERVICE_PORT: 8080
      ATS_GRPC_PORT: 9090
      ATS_STORAGE_TYPE: ${ATS_STORAGE_TYPE:-s3}
      ATS_S3_ENDPOINT: http://minio:9000
      ATS_S3_ACCESS_KEY: ${ATS_S3_ACCESS_KEY:-minioadmin}
      ATS_S3_SECRET_KEY: ${ATS_S3_SECRET_KEY:-minioadmin}
      ATS_S3_BUCKET: ${ATS_S3_BUCKET:-ats-resumes}
      # Dev-only ключ. В production задаётся из секрета и не коммитится.
      ATS_PII_ENCRYPTION_KEY: ${ATS_PII_ENCRYPTION_KEY:-N3EUTRUDDeQVaKtCpzs3IYQTdYw8rQp/CSnETlKL5/U=}
      ATS_PII_NER_PROVIDER: ${ATS_PII_NER_PROVIDER:-fake}
      ATS_PII_NER_MODEL_PATH: ${ATS_PII_NER_MODEL_PATH:-/models/ner/model.onnx}
      ATS_PII_NER_TOKENIZER_PATH: ${ATS_PII_NER_TOKENIZER_PATH:-/models/ner/tokenizer.json}
      ATS_PII_NER_CONFIG_PATH: ${ATS_PII_NER_CONFIG_PATH:-/models/ner/config.json}
      # Словарь навыков. При недоступности ats падает на локальные таблицы.
      ATS_DICTIONARY_ENABLED: ${ATS_DICTIONARY_ENABLED:-true}
      DICTIONARY_GRPC_TARGET: ${DICTIONARY_GRPC_TARGET:-dictionary-service:8084}
      # Внутренние gRPC-вызовы идут в тот же процесс.
      ATS_VACANCY_GRPC_TARGET: localhost:9090
      SCORING_GRPC_TARGET: ${SCORING_GRPC_TARGET:-scoring-service:8082}
      # Free-reasoning-модели отвечают дольше 60 с: дедлайн должен быть с запасом.
      ATS_SCORING_DEADLINE: ${ATS_SCORING_DEADLINE:-60s}
      # Сколько вакансий уходит в один gRPC-вызов обратного подбора.
      ATS_RESUME_MATCH_BATCH_SIZE: ${ATS_RESUME_MATCH_BATCH_SIZE:-3}
      ATS_GITHUB_ENABLED: ${ATS_GITHUB_ENABLED:-false}
      ATS_GITHUB_TOKEN: ${ATS_GITHUB_TOKEN:-}
      # hh.ru: публикация через API и вебхук NEW_NEGOTIATION_VACANCY.
      ATS_HH_ENABLED: ${ATS_HH_ENABLED:-false}
      ATS_HH_API_BASE_URL: ${ATS_HH_API_BASE_URL:-https://api.hh.ru}
      ATS_HH_TOKEN: ${ATS_HH_TOKEN:-}
      ATS_HH_EMPLOYER_ID: ${ATS_HH_EMPLOYER_ID:-}
      ATS_HH_WEBHOOK_TOKEN: ${ATS_HH_WEBHOOK_TOKEN:-}
      ATS_HH_WEBHOOK_PUBLIC_URL: ${ATS_HH_WEBHOOK_PUBLIC_URL:-}
      ATS_HH_SUBSCRIPTION_ID: ${ATS_HH_SUBSCRIPTION_ID:-}
      # Telegram-алерты: только вакансия и Score_pre, без PII.
      ATS_TELEGRAM_ENABLED: ${ATS_TELEGRAM_ENABLED:-false}
      ATS_TELEGRAM_BOT_TOKEN: ${ATS_TELEGRAM_BOT_TOKEN:-}
      ATS_TELEGRAM_CHAT_ID: ${ATS_TELEGRAM_CHAT_ID:-}
      ATS_TELEGRAM_BASE_URL: ${ATS_TELEGRAM_BASE_URL:-https://api.telegram.org}
      ATS_FRONTEND_BASE_URL: ${ATS_FRONTEND_BASE_URL:-http://localhost:3000}
      # Для запуска без ключа: ATS_PROFILES=mock-llm
      SPRING_PROFILES_ACTIVE: ${ATS_PROFILES:-}
      # Compose подставляет значение из корневого .env или окружения хоста.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      # Модель для вакансий и генерации. Ключ по умолчанию — OPENROUTER_API_KEY.
      VACANCY_LLM_BASE_URL: ${VACANCY_LLM_BASE_URL:-https://openrouter.ai/api/v1}
      VACANCY_LLM_MODEL: ${VACANCY_LLM_MODEL:-dots-studio/dots-3-note-preview:free}
      VACANCY_LLM_API_KEY: ${VACANCY_LLM_API_KEY:-${OPENROUTER_API_KEY:-}}
      # Fallback Cloudflare Workers AI включается явно.
      CLOUDFLARE_AI_ENABLED: ${CLOUDFLARE_AI_ENABLED:-false}
      CLOUDFLARE_AI_BASE_URL: ${CLOUDFLARE_AI_BASE_URL:-}
      CLOUDFLARE_AI_API_TOKEN: ${CLOUDFLARE_AI_API_TOKEN:-}
      CLOUDFLARE_AI_MODEL: ${CLOUDFLARE_AI_MODEL:-@cf/qwen/qwen3.8-27b}
      CLOUDFLARE_AI_REASONING_EFFORT: ${CLOUDFLARE_AI_REASONING_EFFORT:-low}
      MOCK_LLM_URL: http://mock-llm:8089/api/v1
    volumes:
      # scripts/download-ner.sh кладёт сюда ONNX-модель; для fake-NER каталог не нужен.
      - ./models:/models:ro
    ports:
      - "${ATS_SERVICE_PORT:-8080}:8080"
      - "${ATS_GRPC_PORT:-9090}:9090"
    depends_on:
      migrations:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      scoring-service:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      ATS_SERVICE_URL: http://ats-service:8080
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - ats-service
    restart: unless-stopped

volumes:
  ats-pgdata:
  ats-minio:
  mock-hh-data:
