name: tracing-ats

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ats}
      POSTGRES_USER: ${POSTGRES_USER:-ats}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ats}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ats-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Отдельная джоба: накатывает схему и завершается.
  migrations:
    build:
      context: ./migrations
    image: ats-migrations:local
    environment:
      LIQUIBASE_COMMAND_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-ats}
      LIQUIBASE_COMMAND_USERNAME: ${POSTGRES_USER:-ats}
      LIQUIBASE_COMMAND_PASSWORD: ${POSTGRES_PASSWORD:-ats}
      LIQUIBASE_COMMAND_CHANGELOG_FILE: db.changelog-master.xml
      LIQUIBASE_SEARCH_PATH: /liquibase/changelog
    command: ["update"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  minio:
    # MinIO community-образы удалены из Docker Hub/Quay в 2026.
    # pgsty/minio — API-совместимый форк; клиент — pgsty/mc.
    image: ${ATS_MINIO_IMAGE:-pgsty/minio:RELEASE.2026-08-04T00-00-00Z}
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${ATS_S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${ATS_S3_SECRET_KEY:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - ats-minio:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Создаёт бакет для оригиналов. Идемпотентно.
  minio-init:
    image: ${ATS_MINIO_MC_IMAGE:-pgsty/mc:RELEASE.2026-09-16T00-00-00Z}
    environment:
      MINIO_ROOT_USER: ${ATS_S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${ATS_S3_SECRET_KEY:-minioadmin}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        && mc mb --ignore-existing local/${ATS_S3_BUCKET:-ats-resumes}
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

  scoring-service:
    build:
      context: ./scoring-service
      dockerfile: Dockerfile
    ports:
      - "${SCORING_SERVICE_PORT:-8082}:8082"
    restart: unless-stopped

  vacancy-service:
    build:
      context: .
      dockerfile: vacancy-service/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-ats}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-ats}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-ats}
      VACANCY_GRPC_PORT: 9090
    ports:
      - "${VACANCY_SERVICE_PORT:-8080}:8080"
      - "${VACANCY_GRPC_PORT:-9090}:9090"
    depends_on:
      migrations:
        condition: service_completed_successfully
    restart: unless-stopped

  resume-service:
    build:
      context: .
      dockerfile: resume-service/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-ats}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-ats}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-ats}
      ATS_STORAGE_TYPE: s3
      ATS_S3_ENDPOINT: http://minio:9000
      ATS_S3_ACCESS_KEY: ${ATS_S3_ACCESS_KEY:-minioadmin}
      ATS_S3_SECRET_KEY: ${ATS_S3_SECRET_KEY:-minioadmin}
      ATS_S3_BUCKET: ${ATS_S3_BUCKET:-ats-resumes}
      # Dev-only ключ. В production задаётся из секрета и не коммитится.
      ATS_PII_ENCRYPTION_KEY: ${ATS_PII_ENCRYPTION_KEY:-N3EUTRUDDeQVaKtCpzs3IYQTdYw8rQp/CSnETlKL5/U=}
      ATS_PII_NER_PROVIDER: ${ATS_PII_NER_PROVIDER:-fake}
      ATS_PII_NER_MODEL_PATH: ${ATS_PII_NER_MODEL_PATH:-/models/ner/model.onnx}
      ATS_PII_NER_TOKENIZER_PATH: ${ATS_PII_NER_TOKENIZER_PATH:-/models/ner/tokenizer.json}
      ATS_PII_NER_CONFIG_PATH: ${ATS_PII_NER_CONFIG_PATH:-/models/ner/config.json}
      VACANCY_GRPC_TARGET: vacancy-service:9090
      SCORING_GRPC_TARGET: scoring-service:8082
      ATS_GITHUB_ENABLED: ${ATS_GITHUB_ENABLED:-false}
      ATS_GITHUB_TOKEN: ${ATS_GITHUB_TOKEN:-}
    volumes:
      # scripts/download-ner.sh кладёт сюда ONNX-модель; для fake-NER каталог не нужен.
      - ./models:/models:ro
    ports:
      - "${RESUME_SERVICE_PORT:-8081}:8081"
    depends_on:
      migrations:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      vacancy-service:
        condition: service_started
      scoring-service:
        condition: service_healthy
    restart: unless-stopped

volumes:
  ats-pgdata:
  ats-minio:
