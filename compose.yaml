name: tracing-ats

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ats}
      POSTGRES_USER: ${POSTGRES_USER:-ats}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ats}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ats-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Отдельная джоба: накатывает схему и завершается.
  migrations:
    build:
      context: ./migrations
    image: ats-migrations:local
    environment:
      LIQUIBASE_COMMAND_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-ats}
      LIQUIBASE_COMMAND_USERNAME: ${POSTGRES_USER:-ats}
      LIQUIBASE_COMMAND_PASSWORD: ${POSTGRES_PASSWORD:-ats}
      LIQUIBASE_COMMAND_CHANGELOG_FILE: db.changelog-master.xml
      LIQUIBASE_SEARCH_PATH: /liquibase/changelog
    command: ["update"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  resume-service:
    build:
      context: ./resume-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-ats}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-ats}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-ats}
    ports:
      - "${RESUME_SERVICE_PORT:-8081}:8081"
    depends_on:
      migrations:
        condition: service_completed_successfully
    restart: unless-stopped

  vacancy-service:
    build:
      context: .
      dockerfile: vacancy-service/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-ats}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-ats}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-ats}
      # Для запуска без ключа: VACANCY_PROFILES=mock-llm
      SPRING_PROFILES_ACTIVE: ${VACANCY_PROFILES:-}
      # Compose подставляет значение из корневого .env или окружения хоста.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      MOCK_LLM_URL: http://mock-llm:8089/api/v1
    ports:
      - "${VACANCY_SERVICE_PORT:-8080}:8080"
    depends_on:
      migrations:
        condition: service_completed_successfully
    restart: unless-stopped

  # Stateless онлайн-ML: без БД, файлов и внешних источников.
  scoring-service:
    build:
      context: ./scoring-service
    environment:
      SCORING_SERVICE_GRPC_HOST: 0.0.0.0
      SCORING_SERVICE_GRPC_PORT: 8082
      SCORING_SERVICE_LOG_LEVEL: ${SCORING_SERVICE_LOG_LEVEL:-INFO}
    ports:
      - "${SCORING_SERVICE_PORT:-8082}:8082"
    restart: unless-stopped

  mock-llm:
    build:
      context: ./infra/mock-llm
    ports:
      - "${MOCK_LLM_PORT:-8089}:8089"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      VACANCY_SERVICE_URL: http://vacancy-service:8080
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - vacancy-service
    restart: unless-stopped

volumes:
  ats-pgdata:
