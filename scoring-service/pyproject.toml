[project]
name = "scoring-service"
version = "0.1.0"
description = "Online ML scoring service"
readme = "README.md"
authors = [{ name = "Nikita Moskaliov", email = "nikwit10@gmail.com" }]
requires-python = ">=3.14"
dependencies = [
    "googleapis-common-protos>=1.76.0",
    "grpcio>=1.85.1",
    "grpcio-health-checking>=1.85.1",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
]

[project.scripts]
scoring-service = "api:main"
scoring-service-healthcheck = "api.healthcheck:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["api", "scoring_service"]

[dependency-groups]
dev = ["grpcio-tools>=1.85.1", "pytest>=9.2.0", "ruff>=0.17.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"
exclude = [
    "src/scoring_service"
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
