          minLength: 3
          maxLength: 512

    RevealedCandidate:
      type: object
      properties:
        fullName:
          type: string
        email:
          type: string
        phone:
          type: string
        university:
          type: string
        graduationYear:
          type: integer
        githubUrl:
          type: string
        originalFilename:
          type: string

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    auth:
      description: Auth response with token
      headers:
        Set-Cookie:
          description: Refresh token
          schema:
            example: refresh_token=xyz; HttpOnly; Secure; Path=/refresh
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AccessToken"
    bad:
      description: Bad request

    default:
      description: Status response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiStatusResponse"
