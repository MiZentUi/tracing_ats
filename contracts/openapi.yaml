          $ref: "#/components/responses/default"

  /admin/dictionary/qualification-review-items:
    get:
      tags: [Dictionary]
      operationId: listDictionaryQualificationReviewItems
      parameters:
        - name: status
          in: query
          schema: { type: string, default: PENDING }
        - name: limit
          in: query
