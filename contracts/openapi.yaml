      properties:
        applicationId:
          type: string
          format: uuid
          description: Заполнено только для отчёта по отклику.
        resumeId:
          type: string
          format: uuid
          description: Заполнено для отчёта по паре резюме и вакансия.
        vacancyId:
          type: string
          format: uuid
          description: Заполнено для отчёта по паре резюме и вакансия.
        phase:
          type: string
          enum:
            - PRELIMINARY
            - FINAL
        relevance:
          type: number
          format: double
          description: Общая релевантность навыков (`Rv`), 0..1.
        score:
          type: number
          format: double
        scoreLow:
          type: number
          format: double
        scoreHigh:
          type: number
          format: double
        capApplied:
          type: boolean
        decision:
          type: string
          enum:
            - SHORTLISTED
            - BORDERLINE
            - NOT_SHORTLISTED
        requirements:
          type: array
          items:
            $ref: "#/components/schemas/RequirementReportItem"
        externalEvidence:
          type: array
          items:
            $ref: "#/components/schemas/ExternalEvidenceItem"
        flags:
          type: array
          items:
            type: string
        blind:
          type: boolean

    RequirementReportItem:
      type: object
      required:
        - requirementId
        - text
        - kind
        - critical
        - cR
        - status
      properties:
        requirementId:
          type: string
        text:
          type: string
        kind:
          type: string
          enum:
            - MUST
            - NICE
            - OPTIONAL
        critical:
          type: boolean
        relevance:
          type: number
          format: double
          description: Релевантность требования (`R_i`), 0..1.
        cR:
          type: number
          format: double
          description: Покрытие требования (`c_i`), 0..1.
        tenure:
          type: integer
          description: Подтверждённый стаж по требованию, лет.
        status:
          type: string
          enum:
            - COVERED
            - PARTIAL
            - GAP
            - NOT_STATED
            - ABSENT
        evidenceSource:
          type: string
          enum:
            - RESUME
            - GITHUB
        evidenceQuote:
          type: string
        gap:
          type: string

    ExternalEvidenceItem:
      type: object
      required:
