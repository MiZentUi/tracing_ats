          description: Задания генерации
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DictionaryGenerationJob"
        default:
          $ref: "#/components/responses/default"
    post:
      tags: [Dictionary]
      operationId: createDictionaryGenerationJob
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DictionaryCreateGenerationJobRequest"
      responses:
        "200":
          description: Задание генерации
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DictionaryGenerationJob"
        default:
          $ref: "#/components/responses/default"

  /admin/dictionary/generation-jobs/{id}:
    get:
      tags: [Dictionary]
      operationId: getDictionaryGenerationJob
      parameters:
        - $ref: "#/components/parameters/DictionaryId"
      responses:
        "200":
          description: Задание генерации
