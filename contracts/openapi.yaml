  /admin/dictionary/generation-jobs/{id}/reject:
    post:
      tags: [Dictionary]
      operationId: rejectDictionaryGenerationJob
      parameters:
        - $ref: "#/components/parameters/DictionaryId"
      responses:
        "200":
          description: Задание отклонено
