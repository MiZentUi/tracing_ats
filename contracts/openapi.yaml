  /admin/dictionary/qualifications/{id}:
    delete:
      tags: [Dictionary]
      operationId: deleteDictionaryQualification
      parameters:
        - $ref: "#/components/parameters/DictionaryId"
      responses:
        "200":
          description: Квалификация удалена
