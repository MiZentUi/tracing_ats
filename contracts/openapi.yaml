openapi: "3.0.4"
info:
  title: ATS API
  description: ATS Backend OpenAPI Specification
  version: "1.0"
servers:
  - url: https://localhost:8080/api/v1
  - url: http://localhost:8081/api/v1

paths:
  /users/signup:
    post:
      tags:
        - Users
      summary: User registration
      operationId: signUp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthRequest"
      responses:
        "200":
          description: "Signed up"
        default:
          $ref: "#/components/responses/default"

  /users/login:
    post:
      tags:
        - Users
      summary: User login
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthRequest"
      responses:
        "200":
          $ref: "#/components/responses/auth"
        default:
          $ref: "#/components/responses/default"

  /users/refresh:
    post:
      tags:
        - Users
      summary: Refresh token
      operationId: refresh
      parameters:
        - name: refresh_token
          in: cookie
          required: true
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/auth"
        default:
          $ref: "#/components/responses/default"

  /specializations:
    get:
      tags:
        - Reference
      summary: Справочник специализаций
      operationId: listSpecializations
      responses:
        "200":
          description: Список активных специализаций
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Specialization"
        default:
          $ref: "#/components/responses/error"
    post:
      tags:
        - Reference
      summary: Добавить специализацию
      operationId: createSpecialization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSpecializationRequest"
      responses:
        "201":
          description: Специализация создана
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Specialization"
        "409":
          $ref: "#/components/responses/conflict"
        "422":
          $ref: "#/components/responses/unprocessable"
        default:
          $ref: "#/components/responses/error"

  /levels:
    get:
      tags:
        - Reference
      summary: Справочник уровней позиции
      operationId: listLevels
      responses:
        "200":
          description: Список активных уровней
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReferenceItem"
        default:
          $ref: "#/components/responses/error"

  /vacancies:
    get:
      tags:
        - Vacancies
      summary: Список вакансий
      operationId: listVacancies
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 200
            default: 50
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
      responses:
        "200":
          description: Страница вакансий
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VacancyList"
        default:
          $ref: "#/components/responses/error"
    post:
      tags:
        - Vacancies
      summary: Создать вакансию и получить черновик шаблона
      operationId: createVacancy
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - specialization
              properties:
                specialization:
                  type: string
                  description: Код специализации из справочника
                  example: backend
                level:
                  type: string
                  nullable: true
                  description: >-
                    Код уровня из справочника. Обязателен для IT-специализации;
                    для не-IT специализаций игнорируется и подставляется «Без уровня».
                  example: middle
                title:
                  type: string
                  nullable: true
                text:
                  type: string
                  nullable: true
                  description: Текст вакансии, если не передан файл
                file:
                  type: string
                  format: binary
                  nullable: true
                  description: PDF, DOCX, TXT или MD, если не передан текст
      responses:
        "201":
          description: Вакансия создана, шаблон в статусе черновика
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vacancy"
        "409":
          $ref: "#/components/responses/conflict"
        "413":
          $ref: "#/components/responses/payloadTooLarge"
        "415":
          $ref: "#/components/responses/unsupportedMediaType"
        "422":
          $ref: "#/components/responses/unprocessable"
        "502":
          $ref: "#/components/responses/badGateway"
        "503":
          $ref: "#/components/responses/serviceUnavailable"
        default:
          $ref: "#/components/responses/error"
  /vacancies/{id}/template:
    put:
      tags:
        - Vacancies
      summary: Сохранить шаблон, создать новую версию и обновить статистику
      operationId: updateVacancyTemplate
      parameters:
        - $ref: "#/components/parameters/VacancyId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTemplateRequest"
      responses:
        "200":
          description: Новая подтверждённая версия шаблона
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vacancy"
        "404":
          $ref: "#/components/responses/notFound"
        "409":
          $ref: "#/components/responses/conflict"
        "422":
          $ref: "#/components/responses/unprocessable"
        default:
          $ref: "#/components/responses/error"

  /vacancies/{id}:
    get:
      tags:
        - Vacancies
      summary: Вакансия с текущей версией шаблона
      operationId: getVacancy
      parameters:
        - $ref: "#/components/parameters/VacancyId"
      responses:
        "200":
          description: Вакансия с текущей версией шаблона
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vacancy"
        "404":
          $ref: "#/components/responses/notFound"
        default:
          $ref: "#/components/responses/error"
    delete:
      tags:
        - Vacancies
      summary: Удалить вакансию и убрать её вклад из истории типов
      operationId: deleteVacancy
      parameters:
        - $ref: "#/components/parameters/VacancyId"
      responses:
        "204":
          description: Вакансия удалена
        "404":
          $ref: "#/components/responses/notFound"
        default:
          $ref: "#/components/responses/error"

  /resumes:
    get:
      tags:
        - Resumes
      summary: Последние загруженные резюме
      description: Метаданные без PII, новые сначала. Нужны для истории загрузок.
      operationId: listResumes
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
            minimum: 0
      responses:
        "200":
          description: Список резюме
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResumeList"
        default:
          $ref: "#/components/responses/default"
    post:
      tags:
        - Resumes
      summary: Загрузить пачку резюме
      description: |
        Принимает PDF, DOCX, TXT или MD. Для каждого файла извлекается текст,
        PII маскируется, prompt injection удаляется. Исходный файл хранится
        в объектном хранилище, PII — в зашифрованном виде.
        Если `vacancyId` передан, это режим «кандидаты под вакансию»: создаётся
        отклик и считается Score_pre. Без `vacancyId` — режим «вакансии под
        резюме»: отклик не создаётся, запускается сравнение со всеми вакансиями.
      operationId: uploadResumes
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - files
              properties:
                vacancyId:
                  type: string
                  format: uuid
                  description: Вакансия для режима «кандидаты под вакансию». Без неё — обратный режим.
                consentGithub:
                  type: boolean
                  default: false
                  description: Согласие кандидата на обогащение из GitHub.
                files:
                  type: array
                  items:
                    type: string
                    format: binary
      responses:
        "202":
          description: Файлы приняты
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResumeBatchUploadResponse"
        default:
          $ref: "#/components/responses/default"

  /resumes/{resumeId}:
    get:
      tags:
        - Resumes
      summary: Метаданные резюме без PII
      operationId: getResume
      parameters:
        - $ref: "#/components/parameters/ResumeId"
      responses:
        "200":
          description: Резюме
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResumeSummary"
        "404":
          description: Не найдено
        default:
          $ref: "#/components/responses/default"

  /resumes/{resumeId}/text:
    get:
      tags:
        - Resumes
      summary: Обезличенный текст резюме
      description: Текст после маскировки PII и очистки prompt injection. Для визуальной проверки.
      operationId: getResumeText
      parameters:
        - $ref: "#/components/parameters/ResumeId"
      responses:
        "200":
          description: Текст резюме без PII
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResumeText"
        "404":
          description: Не найдено
        default:
          $ref: "#/components/responses/default"

  /resumes/{resumeId}/ranking:
    get:
      tags:
        - ResumeRanking
      summary: Рейтинг вакансий для резюме
      description: |
        Вакансии, отсортированные по Score, который посчитан при загрузке резюме
        в режиме «вакансии под резюме».
      operationId: getResumeVacancyRanking
      parameters:
        - $ref: "#/components/parameters/ResumeId"
      responses:
        "200":
          description: Рейтинг
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResumeVacancyRankingResponse"
        default:
          $ref: "#/components/responses/default"

  /resumes/{resumeId}/match:
    post:
      tags:
        - ResumeRanking
      summary: Пересчитать рейтинг вакансий
      description: |
        Повторно сравнивает уже извлечённое резюме со всеми вакансиями.
        Использует сохранённый ParsedResume: LLM не вызывается.
      operationId: matchResume
      parameters:
        - $ref: "#/components/parameters/ResumeId"
      responses:
        "202":
          description: Пересчёт запущен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScreeningBatchAccepted"
        "404":
          description: Резюме не найдено
        default:
          $ref: "#/components/responses/default"

  /resumes/{resumeId}/vacancies/{vacancyId}/report:
    get:
      tags:
        - Reports
      summary: Отчёт по паре резюме и вакансия
      operationId: getResumeVacancyReport
      parameters:
        - $ref: "#/components/parameters/ResumeId"
        - $ref: "#/components/parameters/VacancyPathId"
      responses:
        "200":
          description: Отчёт без PII
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationReport"
        "404":
          description: Не найдено
        default:
          $ref: "#/components/responses/default"

  /vacancies/{vacancyId}/screen:
    post:
      tags:
        - Screening
      summary: Запустить предварительный скрининг
      description: |
        Асинхронно считает Score_pre по обезличенному тексту, применяет политику
        шорт-листа из vacancy-service и при согласии обогащает шорт-лист из GitHub,
        после чего считает Score_final.
      operationId: startScreening
      parameters:
        - $ref: "#/components/parameters/VacancyPathId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScreeningRequest"
      responses:
        "202":
          description: Скрининг запущен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScreeningBatchAccepted"
        default:
          $ref: "#/components/responses/default"

  /screening-batches/{batchId}:
    get:
      tags:
        - Screening
      summary: Статус пакета скрининга
      operationId: getScreeningBatch
      parameters:
        - $ref: "#/components/parameters/BatchId"
      responses:
        "200":
          description: Статус
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScreeningBatchStatus"
        "404":
          description: Не найдено
        default:
          $ref: "#/components/responses/default"

  /vacancies/{vacancyId}/ranking:
    get:
      tags:
        - Ranking
      summary: Рейтинг кандидатов по вакансии
      operationId: getRanking
      parameters:
        - $ref: "#/components/parameters/VacancyPathId"
        - $ref: "#/components/parameters/Phase"
      responses:
        "200":
          description: Рейтинг
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RankingResponse"
        default:
          $ref: "#/components/responses/default"

  /applications/{applicationId}/report:
    get:
      tags:
        - Reports
      summary: Отчёт «требование → доказательство → пробел»
      operationId: getApplicationReport
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
        - $ref: "#/components/parameters/Phase"
      responses:
        "200":
          description: Отчёт без PII
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationReport"
        "404":
          description: Не найдено
        default:
          $ref: "#/components/responses/default"

  /applications/{applicationId}/reveal:
    post:
      tags:
        - Reports
      summary: Раскрыть PII кандидата
      description: Отдельное действие с обязательной причиной и записью в аудит.
      operationId: revealCandidate
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevealRequest"
      responses:
        "200":
          description: PII раскрыты
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevealedCandidate"
        "404":
          description: Не найдено
        default:
          $ref: "#/components/responses/default"

components:
  parameters:
    VacancyId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    VacancyPathId:
      name: vacancyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ResumeId:
      name: resumeId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BatchId:
      name: batchId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ApplicationId:
      name: applicationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Phase:
      name: phase
      in: query
      required: false
      schema:
        type: string
        enum:
          - PRELIMINARY
          - FINAL
        default: FINAL

  schemas:
    ReferenceItem:
      type: object
      required:
        - code
        - name
      properties:
        code:
          type: string
          example: backend
        name:
          type: string
          example: Backend

    Specialization:
      type: object
      required:
        - code
        - name
        - it
      properties:
        code:
          type: string
          example: backend
        name:
          type: string
          example: Backend
        it:
          type: boolean
          description: >-
            IT-специализация. Для IT обязателен уровень (грейд), для остальных
            специализаций грейд не запрашивается.
          example: true

    CreateSpecializationRequest:
      type: object
      required:
        - name
        - it
      properties:
        name:
          type: string
          example: Аналитика
        code:
          type: string
          nullable: true
          description: Латинский код; если не указан, генерируется из названия
          example: analytics
        it:
          type: boolean
          description: IT-специализация или нет; обязательное поле
          example: false

    SkillKind:
      type: string
      enum:
        - MUST
        - NICE
        - OPTIONAL

    KindSource:
      type: string
      enum:
        - LLM
        - HISTORY
        - HR

    NormalizationStatus:
      type: string
      enum:
        - MATCHED
        - NEW

    VacancyStatus:
      type: string
      enum:
        - DRAFT
        - ACTIVE
        - CLOSED
        - ARCHIVED

    SkillKindHistory:
      type: object
      required:
        - must
        - nice
        - optional
      properties:
        must:
          type: integer
          format: int32
        nice:
          type: integer
          format: int32
        optional:
          type: integer
          format: int32

    Requirement:
      type: object
      required:
        - id
        - normalization_status
        - kind
        - kind_source
      properties:
        id:
          type: string
          description: Идентификатор требования в версии шаблона
        skill:
          type: string
          nullable: true
        skill_id:
          type: string
          format: uuid
          nullable: true
        normalization_status:
          $ref: "#/components/schemas/NormalizationStatus"
        kind:
          $ref: "#/components/schemas/SkillKind"
        kind_source:
          $ref: "#/components/schemas/KindSource"
        llm_kind:
          allOf:
            - $ref: "#/components/schemas/SkillKind"
          nullable: true
        years_required:
          type: number
          format: double
          nullable: true
        quote:
          type: string
          nullable: true
        clarity_warning:
          type: string
          nullable: true
        history:
          allOf:
            - $ref: "#/components/schemas/SkillKindHistory"
          nullable: true

    TemplateMeta:
      type: object
      properties:
        model:
          type: string
          nullable: true
        prompt_version:
          type: string
          nullable: true
        dropped_requirements:
          type: integer
          format: int32

    VacancyTemplate:
      type: object
      required:
        - version
        - is_confirmed
        - requirements
      properties:
        version:
          type: integer
          format: int32
        is_confirmed:
          type: boolean
        requirements:
          type: array
          items:
            $ref: "#/components/schemas/Requirement"
        meta:
          $ref: "#/components/schemas/TemplateMeta"

    Vacancy:
      type: object
      required:
        - vacancy_id
        - specialization
        - level
        - status
        - template
      properties:
        vacancy_id:
          type: string
          format: uuid
        specialization:
          type: string
        level:
          type: string
        title:
          type: string
          nullable: true
        status:
          $ref: "#/components/schemas/VacancyStatus"
        source_text:
          type: string
          description: Исходный текст вакансии, по которому разбирались требования
        template:
          $ref: "#/components/schemas/VacancyTemplate"

    VacancySummary:
      type: object
      required:
        - id
        - title
        - specialization
        - level
        - status
        - version
        - is_confirmed
        - requirements_count
        - created_at
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        specialization:
          type: string
        level:
          type: string
        status:
          $ref: "#/components/schemas/VacancyStatus"
        version:
          type: integer
          format: int32
        is_confirmed:
          type: boolean
        requirements_count:
          type: integer
          format: int32
        created_at:
          type: string
          format: date-time

    VacancyList:
      type: object
      required:
        - items
        - total
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/VacancySummary"
        total:
          type: integer
          format: int64

    UpdateRequirement:
      type: object
      required:
        - kind
      properties:
        id:
          type: string
          nullable: true
        skill:
          type: string
          nullable: true
        kind:
          $ref: "#/components/schemas/SkillKind"
        years_required:
          type: number
          format: double
          nullable: true
        quote:
          type: string
          nullable: true
        clarity_warning:
          type: string
          nullable: true

    UpdateTemplateRequest:
      type: object
      required:
        - base_version
        - requirements
      properties:
        base_version:
          type: integer
          format: int32
        specialization:
          type: string
          nullable: true
        level:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        requirements:
          type: array
          items:
            $ref: "#/components/schemas/UpdateRequirement"

    AuthRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          example: username
        password:
          type: string
          format: password
          example: password123

    AccessToken:
      type: object
      required:
        - access_token
      properties:
        access_token:
          type: string

    ApiStatusResponse:
      type: object
      required:
        - code
        - status
        - message
      properties:
        code:
          type: integer
        status:
          type: string
        message:
          type: string

    ResumeBatchUploadResponse:
      type: object
      required:
        - resumes
      properties:
        vacancyId:
          type: string
          format: uuid
          description: Передана только в режиме «кандидаты под вакансию».
        batchId:
          type: string
          format: uuid
          description: Пакет сравнения резюме с вакансиями; только в обратном режиме.
        resumes:
          type: array
          description: Результаты в порядке файлов запроса.
          items:
            $ref: "#/components/schemas/ResumeUploadResult"

    ResumeUploadResult:
      type: object
      required:
        - status
      properties:
        resumeId:
          type: string
          format: uuid
          description: Идентификатор резюме; отсутствует, если файл не удалось прочитать.
        status:
          type: string
          enum:
            - MASKED
            - TEXT_EMPTY
            - MASKING_FAILED
            - FAILED
