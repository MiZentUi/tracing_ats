              schema:
                $ref: "#/components/schemas/DictionaryGenerationJob"
        default:
          $ref: "#/components/responses/default"


components:
  parameters:
    DictionaryId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    VacancyId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    VacancyPathId:
      name: vacancyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ResumeId:
      name: resumeId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BatchId:
      name: batchId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ApplicationId:
      name: applicationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Phase:
      name: phase
      in: query
      required: false
      schema:
        type: string
        enum:
          - PRELIMINARY
          - FINAL
        default: FINAL

  schemas:
    ReferenceItem:
      type: object
      required:
        - code
        - name
      properties:
        code:
          type: string
          example: backend
        name:
          type: string
          example: Backend

    Specialization:
      type: object
      required:
        - code
        - name
        - it
      properties:
        code:
          type: string
          example: backend
        name:
          type: string
          example: Backend
        it:
          type: boolean
          description: >-
            IT-специализация. Для IT обязателен уровень (грейд), для остальных
            специализаций грейд не запрашивается.
          example: true

    CreateSpecializationRequest:
      type: object
      required:
        - name
        - it
      properties:
        name:
          type: string
          example: Аналитика
        code:
          type: string
          nullable: true
          description: Латинский код; если не указан, генерируется из названия
          example: analytics
        it:
          type: boolean
          description: IT-специализация или нет; обязательное поле
          example: false

    SkillKind:
      type: string
      enum:
        - MUST
        - NICE
        - OPTIONAL

    KindSource:
      type: string
      enum:
        - LLM
        - HISTORY
        - HR

    NormalizationStatus:
      type: string
      enum:
        - MATCHED
        - NEW

    VacancyStatus:
      type: string
      enum:
        - DRAFT
        - ACTIVE
        - CLOSED
        - ARCHIVED

    SkillKindHistory:
      type: object
      required:
        - must
        - nice
        - optional
      properties:
        must:
          type: integer
          format: int32
        nice:
          type: integer
          format: int32
        optional:
          type: integer
          format: int32

    Requirement:
      type: object
      required:
        - id
        - normalization_status
        - kind
        - kind_source
      properties:
        id:
          type: string
          description: Идентификатор требования в версии шаблона
        skill:
          type: string
          nullable: true
        skill_id:
          type: string
          format: uuid
          nullable: true
        normalization_status:
          $ref: "#/components/schemas/NormalizationStatus"
        kind:
          $ref: "#/components/schemas/SkillKind"
        kind_source:
          $ref: "#/components/schemas/KindSource"
        llm_kind:
          allOf:
            - $ref: "#/components/schemas/SkillKind"
          nullable: true
        years_required:
          type: number
          format: double
          nullable: true
        quote:
          type: string
          nullable: true
        clarity_warning:
          type: string
          nullable: true
        history:
          allOf:
            - $ref: "#/components/schemas/SkillKindHistory"
          nullable: true
        qualification:
          type: boolean
          description: true — требование является квалификацией, а не навыком.
        education_level:
          type: string
          nullable: true
          description: >-
            Уровень образования: SECONDARY, SECONDARY_SPECIALIZED, BACHELOR,
            MASTER, DOCTOR или COURSES. null — требование не об образовании.
        education_specialty:
          type: string
          nullable: true
          description: Специальность или направление подготовки для требования к образованию.

    TemplateMeta:
      type: object
      properties:
        model:
          type: string
          nullable: true
        prompt_version:
          type: string
          nullable: true
        dropped_requirements:
          type: integer
          format: int32

    VacancyTemplate:
      type: object
      required:
        - version
        - is_confirmed
        - requirements
      properties:
        version:
          type: integer
          format: int32
        is_confirmed:
          type: boolean
        requirements:
          type: array
          items:
            $ref: "#/components/schemas/Requirement"
        meta:
          $ref: "#/components/schemas/TemplateMeta"

    Vacancy:
      type: object
      required:
        - vacancy_id
        - specialization
        - level
        - status
        - template
      properties:
        vacancy_id:
          type: string
          format: uuid
        specialization:
          type: string
        level:
          type: string
        title:
          type: string
          nullable: true
        status:
          $ref: "#/components/schemas/VacancyStatus"
        source_text:
          type: string
          description: Исходный текст вакансии, по которому разбирались требования
        template:
          $ref: "#/components/schemas/VacancyTemplate"

    VacancySummary:
      type: object
      required:
        - id
        - title
        - specialization
        - level
        - status
        - version
        - is_confirmed
        - requirements_count
        - created_at
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        specialization:
          type: string
        level:
          type: string
        status:
          $ref: "#/components/schemas/VacancyStatus"
        version:
          type: integer
          format: int32
        is_confirmed:
          type: boolean
        requirements_count:
          type: integer
          format: int32
        created_at:
          type: string
          format: date-time

    VacancyList:
      type: object
      required:
        - items
        - total
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/VacancySummary"
        total:
          type: integer
          format: int64

    UpdateRequirement:
      type: object
      required:
        - kind
      properties:
        id:
          type: string
          nullable: true
        skill:
          type: string
          nullable: true
        kind:
          $ref: "#/components/schemas/SkillKind"
        years_required:
          type: number
          format: double
          nullable: true
        quote:
          type: string
          nullable: true
        clarity_warning:
          type: string
          nullable: true
        education_level:
          type: string
          nullable: true
          description: >-
            Уровень образования: SECONDARY, SECONDARY_SPECIALIZED, BACHELOR,
            MASTER, DOCTOR или COURSES. null — требование не об образовании.
        education_specialty:
          type: string
          nullable: true
          description: Специальность или направление подготовки для требования к образованию.

    UpdateTemplateRequest:
      type: object
      required:
        - base_version
        - requirements
      properties:
        base_version:
          type: integer
          format: int32
        specialization:
          type: string
          nullable: true
        level:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        source_text:
          type: string
          nullable: true
          maxLength: 30000
          description: Новый исходный текст вакансии. Если не передан, текст не меняется.
        confirm:
          type: boolean
          nullable: true
          description: >-
            Зафиксировать версию как шаблон. Если не передан, сохраняется
            прежнее поведение — версия подтверждается. Явный false оставляет
            вакансию черновиком: версия не считается шаблоном.
        requirements:
          type: array
          items:
            $ref: "#/components/schemas/UpdateRequirement"

    AuthRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          example: username
        password:
          type: string
          format: password
          example: password123

    AccessToken:
      type: object
      required:
        - access_token
      properties:
        access_token:
          type: string

    ApiStatusResponse:
      type: object
      required:
        - code
        - status
        - message
      properties:
        code:
          type: integer
        status:
          type: string
        message:
          type: string

    ResumeBatchUploadResponse:
      type: object
      required:
        - resumes
      properties:
        vacancyId:
          type: string
          format: uuid
          description: Передана только в режиме «кандидаты под вакансию».
        batchId:
          type: string
          format: uuid
          description: Пакет сравнения резюме с вакансиями; только в обратном режиме.
        resumes:
          type: array
          description: Результаты в порядке файлов запроса.
          items:
            $ref: "#/components/schemas/ResumeUploadResult"

    ResumeUploadResult:
      type: object
      required:
        - status
      properties:
        resumeId:
          type: string
          format: uuid
          description: Идентификатор резюме; отсутствует, если файл не удалось прочитать.
        status:
          type: string
          enum:
            - MASKED
            - TEXT_EMPTY
            - MASKING_FAILED
            - FAILED
        batchId:
          type: string
          format: uuid
          description: Пакет сравнения с вакансиями; только в обратном режиме.
        warnings:
          type: array
          items:
            type: string

    ResumeText:
      type: object
      required:
        - resumeId
        - maskedText
        - blind
      properties:
        resumeId:
          type: string
          format: uuid
        maskedText:
          type: string
          description: Обезличенный текст; PII заменены плейсхолдерами.
        warnings:
          type: array
          items:
            type: string
        blind:
          type: boolean

    ResumeExtraction:
      type: object
      required:
        - resumeId
        - skills
        - qualifications
        - education
        - experience
      properties:
        resumeId:
          type: string
          format: uuid
        skills:
          type: array
          items:
            $ref: "#/components/schemas/ResumeExtractedSkill"
        qualifications:
          type: array
          items:
            $ref: "#/components/schemas/ResumeExtractedQualification"
        education:
          type: array
          items:
            $ref: "#/components/schemas/ResumeExtractedEducation"
        experience:
          type: array
          items:
            $ref: "#/components/schemas/ResumeExtractedExperience"

    ResumeExtractedExperience:
      type: object
      required:
        - metrics
      properties:
        company:
          type: string
          nullable: true
        position:
          type: string
          nullable: true
        category:
          type: string
          nullable: true
        beginYear:
          type: integer
          format: int32
          nullable: true
        endYear:
          type: integer
          format: int32
          nullable: true
        evidenceQuote:
          type: string
          nullable: true
          description: Основная цитата, подтверждающая опыт.
        metrics:
          type: array
          description: Дополнительные факты и метрики из описания опыта.
          items:
            type: string

    ResumeExtractedQualification:
      type: object
      required:
        - label
      properties:
        label:
          type: string
          description: Название квалификации в формулировке резюме.
        evidenceQuote:
          type: string
          nullable: true

    ResumeExtractedEducation:
      type: object
      required:
        - level
      properties:
        institution:
          type: string
          nullable: true
          description: Учебное заведение после маскировки PII.
        specialty:
          type: string
          nullable: true
          description: Специальность или направление подготовки.
        level:
          type: string
          nullable: true
          description: >-
            Уровень образования: SECONDARY, SECONDARY_SPECIALIZED, BACHELOR,
            MASTER, DOCTOR или COURSES. null — уровень не определён.
        graduationYear:
          type: integer
          format: int32
          nullable: true
        evidenceQuote:
          type: string
          nullable: true

    ResumeExtractedSkill:
      type: object
      required:
        - name
        - normalizedName
      properties:
        name:
          type: string
        normalizedName:
          type: string
        tenure:
          type: integer
          nullable: true
        recency:
          type: integer
          nullable: true
        evidenceQuote:
          type: string
          nullable: true

    ResumeFullText:
      type: object
      required:
        - resumeId
        - text
        - blind
      properties:
        resumeId:
          type: string
          format: uuid
        text:
          type: string
          description: Текст с PII; выдан после reveal с причиной и аудитом.
        blind:
          type: boolean

    RevealTextRequest:
      type: object
      required:
        - reason
      properties:
        reason:
          type: string
          minLength: 3
          maxLength: 512
        applicationId:
          type: string
          format: uuid
          description: Если раскрытие инициировано из отчёта отклика.

    ResumeList:
      type: object
      required:
        - items
        - total
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ResumeSummary"
        total:
          type: integer
          format: int64

    ResumeSummary:
      type: object
      required:
        - resumeId
        - status
        - fileType
        - sizeBytes
        - createdAt
      properties:
        resumeId:
          type: string
          format: uuid
        title:
          type: string
          nullable: true
        status:
          type: string
        fileType:
          type: string
        sizeBytes:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        warnings:
          type: array
          items:
            type: string

    UpdateResumeRequest:
      type: object
      properties:
        title:
          type: string
          nullable: true
          maxLength: 255
        text:
          type: string
          nullable: true
          maxLength: 100000
          description: Полный текст резюме с PII. Backend заново маскирует его перед сохранением.
        reason:
          type: string
          nullable: true
          minLength: 3
          maxLength: 512
          description: Обязательна, если передан text.

    ResumeVacancyRankingResponse:
      type: object
      required:
        - resumeId
        - phase
        - generatedAt
        - items
      properties:
        resumeId:
          type: string
          format: uuid
        phase:
          type: string
          enum:
            - PRELIMINARY
            - FINAL
        generatedAt:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: "#/components/schemas/ResumeVacancyRankingItem"

    ResumeVacancyRankingItem:
      type: object
      required:
        - rank
        - vacancyId
        - score
        - scoreLow
