          format: uuid
        phase:
          type: string
          enum:
            - PRELIMINARY
            - FINAL
        generatedAt:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: "#/components/schemas/RankingItem"

    RankingItem:
      type: object
      required:
        - rank
        - applicationId
        - score
        - scoreLow
        - scoreHigh
