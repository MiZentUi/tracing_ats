openapi: "3.0.4"
info:
  title: ATS API
  description: ATS Backend OpenAPI Specification
  version: "1.0"
servers:
  - url: https://localhost:8080/api/v1
  - url: http://localhost:8081/api/v1

paths:
  /users/signup:
    post:
      tags:
        - Users
      summary: User registration
      operationId: signUp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthRequest"
      responses:
        "200":
          description: "Signed up"
        default:
          $ref: "#/components/responses/default"

  /users/login:
    post:
      tags:
        - Users
      summary: User login
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthRequest"
      responses:
        "200":
          $ref: "#/components/responses/auth"
        default:
          $ref: "#/components/responses/default"

  /users/refresh:
    post:
      tags:
        - Users
      summary: Refresh token
      operationId: refresh
      parameters:
        - name: refresh_token
          in: cookie
          required: true
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/auth"
        default:
          $ref: "#/components/responses/default"

  /specializations:
    get:
      tags:
        - Reference
      summary: Справочник специализаций
      operationId: listSpecializations
      responses:
        "200":
          description: Список активных специализаций
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Specialization"
        default:
          $ref: "#/components/responses/error"
    post:
      tags:
        - Reference
      summary: Добавить специализацию
      operationId: createSpecialization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSpecializationRequest"
      responses:
        "201":
          description: Специализация создана
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Specialization"
        "409":
          $ref: "#/components/responses/conflict"
        "422":
          $ref: "#/components/responses/unprocessable"
        default:
          $ref: "#/components/responses/error"

  /levels:
    get:
      tags:
        - Reference
      summary: Справочник уровней позиции
      operationId: listLevels
      responses:
        "200":
          description: Список активных уровней
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReferenceItem"
        default:
          $ref: "#/components/responses/error"

  /vacancies:
    get:
      tags:
        - Vacancies
      summary: Список вакансий
      operationId: listVacancies
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 200
            default: 50
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
      responses:
        "200":
          description: Страница вакансий
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VacancyList"
        default:
          $ref: "#/components/responses/error"
    post:
      tags:
        - Vacancies
      summary: Создать вакансию и получить черновик шаблона
      operationId: createVacancy
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - specialization
              properties:
                specialization:
                  type: string
                  description: Код специализации из справочника
                  example: backend
                level:
                  type: string
                  nullable: true
                  description: >-
                    Код уровня из справочника. Обязателен для IT-специализации;
                    для не-IT специализаций игнорируется и подставляется «Без уровня».
                  example: middle
                title:
                  type: string
                  nullable: true
                text:
                  type: string
                  nullable: true
                  description: Текст вакансии, если не передан файл
                file:
                  type: string
                  format: binary
                  nullable: true
                  description: PDF, DOCX, TXT или MD, если не передан текст
      responses:
        "201":
          description: Вакансия создана, шаблон в статусе черновика
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vacancy"
        "409":
          $ref: "#/components/responses/conflict"
        "413":
          $ref: "#/components/responses/payloadTooLarge"
        "415":
          $ref: "#/components/responses/unsupportedMediaType"
        "422":
          $ref: "#/components/responses/unprocessable"
        "502":
          $ref: "#/components/responses/badGateway"
        "503":
          $ref: "#/components/responses/serviceUnavailable"
        default:
          $ref: "#/components/responses/error"
  /vacancies/{id}/template:
    put:
      tags:
        - Vacancies
      summary: Сохранить шаблон, создать новую версию и обновить статистику
      operationId: updateVacancyTemplate
      parameters:
        - $ref: "#/components/parameters/VacancyId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTemplateRequest"
      responses:
        "200":
          description: Новая подтверждённая версия шаблона
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vacancy"
        "404":
          $ref: "#/components/responses/notFound"
        "409":
          $ref: "#/components/responses/conflict"
        "422":
          $ref: "#/components/responses/unprocessable"
        default:
          $ref: "#/components/responses/error"

  /vacancies/{id}:
    get:
      tags:
        - Vacancies
      summary: Вакансия с текущей версией шаблона
      operationId: getVacancy
      parameters:
        - $ref: "#/components/parameters/VacancyId"
      responses:
        "200":
          description: Вакансия с текущей версией шаблона
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vacancy"
        "404":
          $ref: "#/components/responses/notFound"
        default:
          $ref: "#/components/responses/error"
    delete:
      tags:
        - Vacancies
      summary: Удалить вакансию и убрать её вклад из истории типов
      operationId: deleteVacancy
      parameters:
        - $ref: "#/components/parameters/VacancyId"
      responses:
        "204":
          description: Вакансия удалена
        "404":
          $ref: "#/components/responses/notFound"
        default:
          $ref: "#/components/responses/error"

  /resumes:
    get:
      tags:
        - Resumes
      summary: Последние загруженные резюме
      description: Метаданные без PII, новые сначала. Нужны для истории загрузок.
      operationId: listResumes
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
            minimum: 0
      responses:
        "200":
          description: Список резюме
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResumeList"
        default:
          $ref: "#/components/responses/default"
    post:
      tags:
        - Resumes
      summary: Загрузить пачку резюме
      description: |
        Принимает PDF, DOCX, TXT или MD. Для каждого файла извлекается текст,
        PII маскируется, prompt injection удаляется. Исходный файл хранится
        в объектном хранилище, PII — в зашифрованном виде.
        Если `vacancyId` передан, это режим «кандидаты под вакансию»: создаётся
        отклик и считается Score_pre. Без `vacancyId` — режим «вакансии под
        резюме»: отклик не создаётся, запускается сравнение со всеми вакансиями.
      operationId: uploadResumes
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - files
              properties:
                vacancyId:
                  type: string
                  format: uuid
                  description: Вакансия для режима «кандидаты под вакансию». Без неё — обратный режим.
                consentGithub:
                  type: boolean
                  default: false
                  description: Согласие кандидата на обогащение из GitHub.
                files:
                  type: array
                  items:
                    type: string
                    format: binary
      responses:
        "202":
          description: Файлы приняты
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResumeBatchUploadResponse"
        default:
          $ref: "#/components/responses/default"

  /resumes/{resumeId}:
    get:
      tags:
        - Resumes
      summary: Метаданные резюме без PII
      operationId: getResume
      parameters:
        - $ref: "#/components/parameters/ResumeId"
      responses:
        "200":
          description: Резюме
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResumeSummary"
        "404":
          description: Не найдено
        default:
          $ref: "#/components/responses/default"
    put:
      tags:
        - Resumes
      summary: Обновить название или текст резюме
      description: >-
        Без `text` меняется только название. Если передан `text`, выполняется
        повторная маскировка PII, обновление vault и parsed_resume, сброс
        устаревших скоров и пересчёт подбора. Для изменения текста обязательна
        причина.
      operationId: updateResume
      parameters:
        - $ref: "#/components/parameters/ResumeId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateResumeRequest"
      responses:
        "200":
          description: Резюме обновлено
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResumeSummary"
        "404":
          description: Не найдено
        "422":
          $ref: "#/components/responses/unprocessable"
        default:
          $ref: "#/components/responses/default"
    delete:
      tags:
        - Resumes
      summary: Удалить резюме
      description: Удаляет резюме, связанные PII, разбор, скоры и отклики.
      operationId: deleteResume
      parameters:
        - $ref: "#/components/parameters/ResumeId"
      responses:
        "204":
          description: Резюме удалено
        "404":
          description: Не найдено
        default:
          $ref: "#/components/responses/default"

  /resumes/{resumeId}/text:
    get:
      tags:
        - Resumes
      summary: Обезличенный текст резюме
      description: Текст после маскировки PII и очистки prompt injection. Для визуальной проверки.
      operationId: getResumeText
      parameters:
        - $ref: "#/components/parameters/ResumeId"
      responses:
        "200":
          description: Текст резюме без PII
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResumeText"
        "404":
          description: Не найдено
        default:
          $ref: "#/components/responses/default"

  /resumes/{resumeId}/extraction:
    get:
      tags:
        - Resumes
      summary: Извлечённые навыки резюме
      description: Обезличенные признаки из последнего ExtractResume без текста резюме и PII.
      operationId: getResumeExtraction
      parameters:
        - $ref: "#/components/parameters/ResumeId"
      responses:
        "200":
          description: Извлечённые навыки
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResumeExtraction"
        "404":
          description: Разбор ещё не готов
        default:
          $ref: "#/components/responses/default"

  /resumes/{resumeId}/reveal-text:
    post:
      tags:
        - Resumes
      summary: Раскрыть исходный текст резюме
      description: |
        Подставляет PII обратно в обезличенный текст. Обязательна причина,
        действие пишется в аудит. Использовать только для ручной проверки.
      operationId: revealResumeText
      parameters:
        - $ref: "#/components/parameters/ResumeId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevealTextRequest"
      responses:
        "200":
          description: Текст с PII
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResumeFullText"
        "404":
          description: Не найдено
        default:
          $ref: "#/components/responses/default"

  /resumes/{resumeId}/ranking:
    get:
      tags:
        - ResumeRanking
      summary: Рейтинг вакансий для резюме
      description: |
        Вакансии, отсортированные по Score, который посчитан при загрузке резюме
        в режиме «вакансии под резюме».
      operationId: getResumeVacancyRanking
      parameters:
        - $ref: "#/components/parameters/ResumeId"
      responses:
        "200":
          description: Рейтинг
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResumeVacancyRankingResponse"
        default:
          $ref: "#/components/responses/default"

  /resumes/{resumeId}/match:
    post:
      tags:
        - ResumeRanking
      summary: Пересчитать рейтинг вакансий
      description: |
        Повторно сравнивает уже извлечённое резюме со всеми вакансиями.
        Использует сохранённый ParsedResume: LLM не вызывается.
      operationId: matchResume
      parameters:
        - $ref: "#/components/parameters/ResumeId"
      responses:
        "202":
          description: Пересчёт запущен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScreeningBatchAccepted"
        "404":
          description: Резюме не найдено
        default:
          $ref: "#/components/responses/default"

  /resumes/{resumeId}/vacancies/{vacancyId}/report:
    get:
      tags:
        - Reports
      summary: Отчёт по паре резюме и вакансия
      operationId: getResumeVacancyReport
      parameters:
        - $ref: "#/components/parameters/ResumeId"
        - $ref: "#/components/parameters/VacancyPathId"
      responses:
        "200":
          description: Отчёт без PII
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationReport"
        "404":
          description: Не найдено
        default:
          $ref: "#/components/responses/default"

  /resumes/{resumeId}/vacancies/{vacancyId}/decision:
    put:
      tags:
        - Reports
      summary: Сохранить решение HR по отчёту
      operationId: saveReportDecision
      parameters:
        - $ref: "#/components/parameters/ResumeId"
        - $ref: "#/components/parameters/VacancyPathId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportDecisionRequest"
      responses:
        "200":
          description: Решение сохранено
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportDecision"
        "404":
          description: Не найдено
        "422":
          $ref: "#/components/responses/unprocessable"
        default:
          $ref: "#/components/responses/default"

  /vacancies/{vacancyId}/screen:
    post:
      tags:
        - Screening
      summary: Запустить предварительный скрининг
      description: |
        Асинхронно считает Score_pre по обезличенному тексту, применяет политику
        шорт-листа из vacancy-service и при согласии обогащает шорт-лист из GitHub,
        после чего считает Score_final.
      operationId: startScreening
      parameters:
        - $ref: "#/components/parameters/VacancyPathId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScreeningRequest"
      responses:
        "202":
          description: Скрининг запущен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScreeningBatchAccepted"
        default:
          $ref: "#/components/responses/default"

  /screening-batches/{batchId}:
    get:
      tags:
        - Screening
      summary: Статус пакета скрининга
      operationId: getScreeningBatch
      parameters:
        - $ref: "#/components/parameters/BatchId"
      responses:
        "200":
          description: Статус
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScreeningBatchStatus"
        "404":
          description: Не найдено
        default:
          $ref: "#/components/responses/default"

  /vacancies/{vacancyId}/ranking:
    get:
      tags:
        - Ranking
      summary: Рейтинг кандидатов по вакансии
      operationId: getRanking
      parameters:
        - $ref: "#/components/parameters/VacancyPathId"
        - $ref: "#/components/parameters/Phase"
      responses:
        "200":
          description: Рейтинг
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RankingResponse"
        default:
          $ref: "#/components/responses/default"

  /applications/{applicationId}/report:
    get:
      tags:
        - Reports
      summary: Отчёт «требование → доказательство → пробел»
      operationId: getApplicationReport
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
        - $ref: "#/components/parameters/Phase"
      responses:
        "200":
          description: Отчёт без PII
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationReport"
        "404":
          description: Не найдено
        default:
          $ref: "#/components/responses/default"

  /applications/{applicationId}/reveal:
    post:
      tags:
        - Reports
      summary: Раскрыть PII кандидата
      description: Отдельное действие с обязательной причиной и записью в аудит.
      operationId: revealCandidate
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevealRequest"
      responses:
        "200":
          description: PII раскрыты
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevealedCandidate"
        "404":
          description: Не найдено
        default:
          $ref: "#/components/responses/default"

  /admin/dictionary/version:
    get:
      tags: [Dictionary]
      operationId: dictionaryVersion
      responses:
        "200":
          description: Версия словаря
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DictionaryVersion"
        default:
          $ref: "#/components/responses/default"

  /admin/dictionary/review-items:
    get:
      tags: [Dictionary]
      operationId: listDictionaryReviewItems
      parameters:
        - name: status
          in: query
          schema: { type: string, default: PENDING }
        - name: limit
          in: query
          schema: { type: integer, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: Очередь новых написаний
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DictionaryReviewItem"
        default:
          $ref: "#/components/responses/default"

  /admin/dictionary/review-items/{id}/resolve:
    post:
      tags: [Dictionary]
      operationId: resolveDictionaryReviewItem
      parameters:
        - $ref: "#/components/parameters/DictionaryId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DictionaryResolveReviewRequest"
      responses:
        "200":
          description: Результат обработки
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DictionaryReviewResult"
        default:
          $ref: "#/components/responses/default"

  /admin/dictionary/skills:
    get:
      tags: [Dictionary]
      operationId: listDictionarySkills
      parameters:
        - name: query
          in: query
          schema: { type: string, default: "" }
        - name: skillType
          in: query
          schema: { type: string, default: "" }
        - name: status
          in: query
          schema: { type: string, default: ACTIVE }
        - name: limit
          in: query
          schema: { type: integer, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: Навыки словаря
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DictionarySkill"
        default:
          $ref: "#/components/responses/default"
    post:
      tags: [Dictionary]
      operationId: createDictionarySkill
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DictionaryCreateSkillRequest"
      responses:
        "200":
          description: Созданный навык
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DictionarySkill"
        default:
          $ref: "#/components/responses/default"

  /admin/dictionary/skills/{id}/aliases:
    post:
      tags: [Dictionary]
      operationId: addDictionarySkillAlias
      parameters:
        - $ref: "#/components/parameters/DictionaryId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DictionaryAddAliasRequest"
      responses:
        "200":
          description: Созданный алиас
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DictionaryAlias"
        default:
          $ref: "#/components/responses/default"

  /admin/dictionary/skills/{id}/canonical:
    post:
      tags: [Dictionary]
      operationId: setDictionarySkillCanonicalAlias
      parameters:
        - $ref: "#/components/parameters/DictionaryId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DictionarySetCanonicalRequest"
      responses:
        "200":
          description: Навык с новым каноном
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DictionarySkill"
        default:
          $ref: "#/components/responses/default"

  /admin/dictionary/aliases/{id}:
    delete:
      tags: [Dictionary]
      operationId: deleteDictionaryAlias
      parameters:
        - $ref: "#/components/parameters/DictionaryId"
      responses:
        "200":
          description: Алиас удалён
        default:
          $ref: "#/components/responses/default"

  /admin/dictionary/skills/{id}/deprecate:
    post:
      tags: [Dictionary]
      operationId: deprecateDictionarySkill
      parameters:
        - $ref: "#/components/parameters/DictionaryId"
