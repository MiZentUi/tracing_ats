syntax = "proto3";
package scoring_service.v1;

import "scoring_service/v1/models/messages.proto";

option java_multiple_files = true;
option java_outer_classname = "ScoringProto";
option java_package = "ats.vacancy.proto";

service ScoringService {
  rpc ScoreResume(scoring_service.v1.models.ScoreResumeRequest) returns (scoring_service.v1.models.ScoreResumeResponse);
}
