syntax = "proto3";

package scoring_service.v1.models.features;
import "scoring_service/v1/models/features/common.proto";

// Бинарная квалификация: группа по электробезопасности, категория
// водительских прав, допуск, аттестат и т.п.
//
// `label` — открытая строка, выведенная из подтверждающей цитаты. Он может
// быть нормализованной формой и не быть её дословной подстрокой: например,
// из «права категорий B и C» получаются два label — для B и для C.
// Закрытого перечня квалификаций в контракте нет: канонический ключ
// вычисляет словарь на стороне Java и передаёт снимок в запросе.
message QualificationRequirement {
  // Название квалификации в формулировке вакансии.
  string label = 1;
}

message QualificationPerResume {
  // Название квалификации в формулировке резюме.
  string label = 1;
  // Ссылка на фрагмент текста, где квалификация указана.
  scoring_service.v1.models.features.FeatureEvidence evidence = 2;
}

// Один алиас открытого словаря. `alias_normalized` и `canonical_key`
// нормализованы одинаковым детерминированным правилом.
message QualificationAlias {
  string alias_normalized = 1;
  string canonical_key = 2;
  string canonical_label = 3;
}

// Снимок словаря на момент запроса. scoring-service stateless:
// словарь приходит в запросе и не читается из БД.
message QualificationCatalog {
  string version = 1;
  repeated QualificationAlias aliases = 2;
}
