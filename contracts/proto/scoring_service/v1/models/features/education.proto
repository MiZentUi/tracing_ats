syntax = "proto3";

package scoring_service.v1.models.features;
import "google/type/date.proto";

enum EducationLevel {
  EDUCATION_LEVEL_UNSPECIFIED = 0;
  // Среднее (школа)
  EDUCATION_LEVEL_SECONDARY = 1;
  // Среднее специальное
  EDUCATION_LEVEL_SECONDARY_SPECIALIZED = 2;
  // Бакалавриат
  EDUCATION_LEVEL_BACHELOR = 3;
  // Магистратура
  EDUCATION_LEVEL_MASTER = 4;
  // PhD, аспирантура и докторантура
  EDUCATION_LEVEL_DOCTOR = 5;
  // Произвольные курсы, не входящие в традиционную систему
  // образования
  EDUCATION_LEVEL_COURSES = 6;
}

message EducationRequirement {
  // Название специальности или направления
  string master = 1;
  EducationLevel level = 2;
}

message EducationPerResume {
  // Организация, в которой было получено образование
  string institution = 1;
  // Год выпуска
  google.type.Date graduation_year = 2;
  // Название специальности или направления
  string master = 3;
}
