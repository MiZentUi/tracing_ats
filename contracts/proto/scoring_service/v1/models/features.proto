syntax = "proto3";

package scoring_service.v1.models;

import "scoring_service/v1/models/features/education.proto";
import "scoring_service/v1/models/features/skill.proto";
import "scoring_service/v1/models/features/experience.proto";
import "scoring_service/v1/models/features/qualification.proto";
import "scoring_service/v1/models/features/common.proto";

option java_multiple_files = true;
option java_outer_classname = "ScoringProto";
option java_package = "ats.vacancy.proto";

// Оценка соответствия фичи из резюме фиче из вакансии.
// В качестве фичи из резюме выбирается наиболее релевантная
// по `c_r`.
message FeatureAssessment {
  // Релевантность (`R_i`)
  double relevance = 1;
  // Покрытие (`c_i`)
  double coverage = 2;
  // Стаж (если известен, `tau`)
  optional int32 tenure = 4;
  // Данные по конкретной фиче
  oneof resume {
    scoring_service.v1.models.features.EducationPerResume education = 6;
    scoring_service.v1.models.features.SkillPerResume skill = 7;
    scoring_service.v1.models.features.PriorExperiencePerResume experience = 8;
    scoring_service.v1.models.features.QualificationPerResume qualification = 9;
  }
}

message FeatureRequirement {
  // Критичность
  scoring_service.v1.models.features.FeatureCriticality criticality = 2;
  // Требование по конкретной фиче или текстовое требование.
  // Для soft skills и прочих требований без структуры используется
  // text_requirement.
  oneof feature {
    scoring_service.v1.models.features.EducationRequirement education = 3;
    scoring_service.v1.models.features.SkillRequirement skill = 4;
    scoring_service.v1.models.features.PriorExperienceRequirement experience = 5;
    scoring_service.v1.models.TextRequirement text_requirement = 6;
    scoring_service.v1.models.features.QualificationRequirement qualification = 8;
  }
  // Источник требования: явное требование или обязанность
  scoring_service.v1.models.features.RequirementSource source = 7;
}

// Требование, для которого нет отдельной структуры:
// soft skills, произвольные требования из обязанностей и т.п.
message TextRequirement {
  // Категория требования. Для SKILL/EXPERIENCE/EDUCATION используются
  // структурированные варианты FeatureRequirement.
  scoring_service.v1.models.features.RequirementCategory category = 1;
  // Исходная формулировка требования
  string text = 2;
}
