syntax = "proto3";

package ats.vacancy.internal.v1;

option java_multiple_files = true;
option java_outer_classname = "VacancyInternalProto";
option java_package = "ats.vacancy.proto";

// Внутренний контракт vacancy-service. Публичный REST в contracts/openapi.yaml,
// этот proto используется только между Java-сервисами.
service VacancyInternalService {
  // Снимок текущей версии шаблона вакансии. Неизменяем: новая версия = новый вызов.
  rpc GetTemplate(GetTemplateRequest) returns (VacancyTemplate);

  // Политика шорт-листа живёт в vacancy-service. resume-service передаёт
  // предварительные баллы и получает решение по каждому кандидату.
  rpc DecideScreening(DecideScreeningRequest) returns (DecideScreeningResponse);
}

message GetTemplateRequest {
  string vacancy_id = 1;
}

message VacancyTemplate {
  string vacancy_id = 1;
  int32 template_version = 2;
  string title = 3;
  string specialization_code = 4;
  string level_code = 5;
  double github_weight = 6;
  ScoringWeights weights = 7;
  repeated Requirement requirements = 8;
  string prompt_version = 9;
  string scoring_version = 10;
  string weights_version = 11;
  // Исходное текстовое описание вакансии. Уходит в scoring-service
  // как `Vacancy.text_description`.
  string source_text = 12;
  // Общий требуемый стаж в годах. Пока выводится из требований,
  // отдельной колонки в vacancy нет.
  uint32 tenure = 13;
}

message ScoringWeights {
  double w_m = 1;
  double w_n = 2;
  double w_f = 3;
}

message Requirement {
  string requirement_id = 1;
  string text = 2;
  string skill = 3;
  RequirementKind kind = 4;
  int32 weight = 5;
  bool critical = 6;
  double years_required = 7;
  double half_life_years = 8;
}

enum RequirementKind {
  REQUIREMENT_KIND_UNSPECIFIED = 0;
  REQUIREMENT_KIND_MUST = 1;
  REQUIREMENT_KIND_NICE = 2;
  REQUIREMENT_KIND_OPTIONAL = 3;
}

message ScreeningCandidate {
  string application_id = 1;
  double score = 2;
  double score_low = 3;
  double score_high = 4;
}

message DecideScreeningRequest {
  string vacancy_id = 1;
  repeated ScreeningCandidate candidates = 2;
}

message ScreeningResult {
  string application_id = 1;
  ScreeningDecision decision = 2;
  bool enrich = 3;
}

enum ScreeningDecision {
  SCREENING_DECISION_UNSPECIFIED = 0;
  SCREENING_DECISION_SHORTLISTED = 1;
  SCREENING_DECISION_BORDERLINE = 2;
  SCREENING_DECISION_NOT_SHORTLISTED = 3;
}

message DecideScreeningResponse {
  repeated ScreeningResult results = 1;
}
