name: tracing-ats

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ats}
      POSTGRES_USER: ${POSTGRES_USER:-ats}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ats}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ats-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Отдельная джоба: накатывает схему и завершается.
  # Сервисы не запускают Liquibase сами, они ждут service_completed_successfully.
  migrations:
    build:
      context: ../backend/migrations
    image: ats-migrations:local
    environment:
      LIQUIBASE_COMMAND_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-ats}
      LIQUIBASE_COMMAND_USERNAME: ${POSTGRES_USER:-ats}
      LIQUIBASE_COMMAND_PASSWORD: ${POSTGRES_PASSWORD:-ats}
      LIQUIBASE_COMMAND_CHANGELOG_FILE: db.changelog-master.xml
      LIQUIBASE_SEARCH_PATH: /liquibase/changelog
    command: ["update"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

volumes:
  ats-pgdata:
