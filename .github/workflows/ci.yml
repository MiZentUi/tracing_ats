name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java:
    name: Java / ${{ matrix.module }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # У text-extraction нет wrapper: Gradle ставит setup-gradle.
          - module: text-extraction
            gradle: gradle
          - module: resume-service
            gradle: ./gradlew
          - module: vacancy-service
            gradle: ./gradlew
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.8.2'
          cache-provider: basic

      - name: Run tests
        working-directory: ${{ matrix.module }}
        run: ${{ matrix.gradle }} test --no-daemon --stacktrace

      - name: Check formatting
        working-directory: ${{ matrix.module }}
        run: ${{ matrix.gradle }} spotlessCheck --no-daemon

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.module }}
          path: |
            ${{ matrix.module }}/build/reports/tests/
            ${{ matrix.module }}/build/test-results/
          if-no-files-found: ignore

  python:
    name: Python / scoring-service
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: scoring-service
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: '0.13.7'
          enable-cache: true
          cache-dependency-glob: scoring-service/uv.lock

      - name: Set up Python 3.14
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --locked

      - name: Check generated protobuf code
        run: |
          uv run sh protoc.sh
          git diff --exit-code -- src/scoring_service

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Run tests
        run: uv run pytest -q

  migrations:
    name: Migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      POSTGRES_PORT: 55432
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate Compose file
        run: docker compose --ansi never config --quiet

      - name: Apply Liquibase migrations
        run: >-
          docker compose --ansi never up
          --build --abort-on-container-exit --exit-code-from migrations
          migrations

      - name: Show container logs
        if: failure()
        run: docker compose --ansi never logs --no-color postgres migrations || true

      - name: Cleanup
        if: always()
        run: docker compose --ansi never down -v --remove-orphans || true
