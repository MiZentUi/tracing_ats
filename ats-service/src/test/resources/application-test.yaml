spring:
  # Тесты поднимают несколько контекстов: gRPC-сервер должен брать свободный порт,
  # а не конфликтовать с запущенным ats-service на 9090.
  grpc:
    server:
      port: 0
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml

ats:
  storage:
    type: memory
  pii:
    # Только для тестов. Production-ключ приходит из секрета.
    encryption-key: N3EUTRUDDeQVaKtCpzs3IYQTdYw8rQp/CSnETlKL5/U=
    key-version: test
    ner:
      provider: fake
      fail-closed: false
  vacancy:
    grpc:
      target: localhost:9090
      deadline: 1s
  scoring:
    worker-threads: 1
    queue-capacity: 100
    grpc:
      target: localhost:8082
      deadline: 1s
  github:
    enabled: false
  screening:
    worker-threads: 1
    scoring-wait: 5s
    scoring-poll: 50ms

vacancy:
  llm:
    api-key: test-key
  template:
    kind-history:
      min-observations: 1
      min-share: 0.6
