spring:
  application:
    name: ats-service
  config:
    import: "optional:file:.env[.properties]"
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  # Схему накатывает отдельная джоба migrations, приложение её не трогает.
  liquibase:
    enabled: false
  jackson:
    deserialization:
      fail-on-unknown-properties: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
  grpc:
    server:
      port: ${ATS_GRPC_PORT:9090}

server:
  port: ${ATS_SERVICE_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    # Один идентификатор запроса в каждой строке: по нему видно всю цепочку вызова в логах.
    level: "%5p [req:%X{request_id:--}]"

ats:
  dev:
    extraction-endpoint:
      # Временный endpoint для ручной проверки. По умолчанию выключен.
      enabled: false
  storage:
    # memory — для тестов; s3 — MinIO/S3.
    type: ${ATS_STORAGE_TYPE:s3}
    endpoint: ${ATS_S3_ENDPOINT:http://localhost:9000}
    access-key: ${ATS_S3_ACCESS_KEY:minioadmin}
    secret-key: ${ATS_S3_SECRET_KEY:minioadmin}
    bucket: ${ATS_S3_BUCKET:ats-resumes}
    region: ${ATS_S3_REGION:us-east-1}
    timeout: 10s
  pii:
    # Base64 32-байтного AES-256 ключа. В production обязателен, в коде значения нет.
    encryption-key: ${ATS_PII_ENCRYPTION_KEY:}
    key-version: ${ATS_PII_KEY_VERSION:v1}
    ner:
      provider: ${ATS_PII_NER_PROVIDER:fake}
      model-path: ${ATS_PII_NER_MODEL_PATH:models/ner/model.onnx}
      tokenizer-path: ${ATS_PII_NER_TOKENIZER_PATH:models/ner/tokenizer.json}
      config-path: ${ATS_PII_NER_CONFIG_PATH:models/ner/config.json}
      confidence-threshold: ${ATS_PII_NER_THRESHOLD:0.85}
      # В production true: без локальной NER текст не уходит в скоринг.
      fail-closed: ${ATS_PII_NER_FAIL_CLOSED:true}
  vacancy:
    # Оба контура живут в одном процессе: gRPC-фасад шаблона и решение по шорт-листу.
    grpc:
      target: ${ATS_VACANCY_GRPC_TARGET:localhost:9090}
      deadline: 5s
  dictionary:
    grpc:
      # Словарь навыков. При недоступности ats падает на локальные таблицы.
      enabled: ${ATS_DICTIONARY_ENABLED:false}
      target: ${DICTIONARY_GRPC_TARGET:localhost:8084}
      deadline: ${ATS_DICTIONARY_DEADLINE:2s}
    screening:
      # Стартовые гипотезы для MVP; политика не входит в обученную модель.
      threshold: ${ATS_SCREENING_THRESHOLD:50}
      top-n: ${ATS_SCREENING_TOP_N:10}
      borderline-margin: ${ATS_SCREENING_BORDERLINE_MARGIN:5}
  scoring:
    # Отдельный пул для скоринга при загрузке.
    worker-threads: ${ATS_SCORING_WORKERS:4}
    queue-capacity: ${ATS_SCORING_QUEUE_CAPACITY:1000}
    grpc:
      target: ${SCORING_GRPC_TARGET:localhost:8082}
      # Внутри scoring-service может вызываться LLM.
      deadline: ${ATS_SCORING_DEADLINE:60s}
  github:
    enabled: ${ATS_GITHUB_ENABLED:false}
    token: ${ATS_GITHUB_TOKEN:}
    base-url: ${ATS_GITHUB_BASE_URL:https://api.github.com}
    max-repos: ${ATS_GITHUB_MAX_REPOS:5}
    timeout: 5s
  hh:
    # Публикация через HH API и приём вебхуков NEW_NEGOTIATION_VACANCY.
    enabled: ${ATS_HH_ENABLED:false}
    api-base-url: ${ATS_HH_API_BASE_URL:https://api.hh.ru}
    token: ${ATS_HH_TOKEN:}
    employer-id: ${ATS_HH_EMPLOYER_ID:}
    webhook-token: ${ATS_HH_WEBHOOK_TOKEN:}
    webhook-public-url: ${ATS_HH_WEBHOOK_PUBLIC_URL:}
    subscription-id: ${ATS_HH_SUBSCRIPTION_ID:}
    user-agent: ${ATS_HH_USER_AGENT:tracing-ats/0.1 (ats@example.com)}
    default-area: ${ATS_HH_DEFAULT_AREA:1}
    default-experience: ${ATS_HH_DEFAULT_EXPERIENCE:between1And3}
    default-employment-form: ${ATS_HH_DEFAULT_EMPLOYMENT_FORM:FULL}
    default-schedule: ${ATS_HH_DEFAULT_SCHEDULE:fullDay}
    default-professional-role: ${ATS_HH_DEFAULT_PROFESSIONAL_ROLE:96}
    timeout: ${ATS_HH_TIMEOUT:10s}
    max-attempts: ${ATS_HH_MAX_ATTEMPTS:3}
    retry-delay: ${ATS_HH_RETRY_DELAY:2s}
  telegram:
    enabled: ${ATS_TELEGRAM_ENABLED:false}
    bot-token: ${ATS_TELEGRAM_BOT_TOKEN:}
    chat-id: ${ATS_TELEGRAM_CHAT_ID:}
    base-url: ${ATS_TELEGRAM_BASE_URL:https://api.telegram.org}
    timeout: ${ATS_TELEGRAM_TIMEOUT:10s}
    max-attempts: ${ATS_TELEGRAM_MAX_ATTEMPTS:3}
    retry-delay: ${ATS_TELEGRAM_RETRY_DELAY:30s}
    frontend-base-url: ${ATS_FRONTEND_BASE_URL:http://localhost:3000}
    poll-interval: ${ATS_TELEGRAM_POLL_INTERVAL:5s}
  screening:
    worker-threads: ${ATS_SCREENING_WORKERS:2}
    # Сколько ждать скоринг при загрузке, прежде чем пометить отклик FAILED.
    scoring-wait: ${ATS_SCREENING_SCORING_WAIT:2m}
    scoring-poll: ${ATS_SCREENING_SCORING_POLL:500ms}
  ingestion:
    extraction:
      max-file-size: 10MB
      max-pdf-pages: 50
      max-text-chars: 200000
      timeout: 10s
      pool-size: 4
  resume:
    match:
      # Сколько вакансий уходит в один gRPC-вызов EvaluateResumeMatches.
      # Маленький батч нужен, чтобы быстрее видеть первые результаты в рейтинге.
      batch-size: ${ATS_RESUME_MATCH_BATCH_SIZE:3}
vacancy:
  llm:
    base-url: ${VACANCY_LLM_BASE_URL:https://openrouter.ai/api/v1}
    # Ключ OpenRouter или отдельного OpenAI-совместимого провайдера.
    # Не вписывай значение сюда: задай VACANCY_LLM_API_KEY или OPENROUTER_API_KEY.
    api-key: ${VACANCY_LLM_API_KEY:${OPENROUTER_API_KEY:}}
    model: ${VACANCY_LLM_MODEL:dots-studio/dots-3-note-preview:free}
    # Запасные модели отключены: free-модели Google отдают 429 из общего пула.
    # Либо отвечает основная модель, либо возвращается LLM_UNAVAILABLE.
    fallback-models: []
    temperature: 0
    # dots-studio — reasoning-модель: при 6000 токенах всё уходит в reasoning,
    # и content приходит пустым (finish_reason=length).
    max-tokens: 20000
    connect-timeout: 5s
    read-timeout: 180s
    total-timeout: 300s
    max-attempts: 3
    delay: 5s
    multiplier: 2
    prompt-version: vacancy-template.v5
    max-requirements: 50
    # Запасной провайдер Cloudflare Workers AI. Включается явно: это ещё одна
    # точка отправки текста вакансии наружу. Используется только после отказа OpenRouter.
    fallback:
      enabled: ${CLOUDFLARE_AI_ENABLED:false}
      # OpenAI-совместимый endpoint:
      # https://api.cloudflare.com/client/v4/accounts/<ACCOUNT_ID>/ai/v1
      base-url: ${CLOUDFLARE_AI_BASE_URL:}
      api-key: ${CLOUDFLARE_AI_API_TOKEN:}
      model: "${CLOUDFLARE_AI_MODEL:@cf/qwen/qwen3.8-27b}"
      fallback-models: []
      # Qwen3.8 по умолчанию использует xhigh; для извлечения требований достаточно low.
      reasoning-effort: ${CLOUDFLARE_AI_REASONING_EFFORT:low}
  template:
    max-text-chars: 30000
    max-file-size: 5MB
    kind-history:
      min-observations: 3
      min-share: 0.6
