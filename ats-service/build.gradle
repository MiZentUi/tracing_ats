plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.2'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'com.diffplug.spotless' version '8.10.4'
	id 'com.google.protobuf' version '0.10.1'
	id 'org.openapi.generator' version '7.27.0'
}

group = 'ats'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

ext {
	set('springGrpcVersion', "1.0.3")
	set('springAiVersion', "2.0.1")
	set('protobufVersion', "4.35.1")
	set('grpcVersion', "1.77.1")
	set('awsSdkVersion', "2.57.11")
	set('onnxRuntimeVersion', "1.31.1")
	set('djlVersion', "0.40.0")
	set('libphonenumberVersion', "9.0.43")
}

// Объединённый сервис использует оба внутренних контракта: scoring и vacancy-internal.
// Копируем только нужные каталоги, иначе protoc увидит две копии google.type.Date.
def scoringProtoRoot = layout.buildDirectory.dir('scoring-proto').get().asFile
def internalProtoRoot = layout.buildDirectory.dir('internal-proto').get().asFile

tasks.register('prepareScoringProtos', Copy) {
	from('../contracts/proto/scoring_service') {
		include '**/*.proto'
	}
	into new File(scoringProtoRoot, 'scoring_service')
}

tasks.register('prepareInternalProtos', Copy) {
	from('../contracts/vacancy-internal.proto')
	into internalProtoRoot
}

sourceSets {
	main {
		proto {
			srcDir internalProtoRoot
			srcDir scoringProtoRoot
		}
	}
}

tasks.matching {
	it.name.toLowerCase().contains('proto') && !it.name.startsWith('prepare')
}.configureEach {
	dependsOn 'prepareScoringProtos', 'prepareInternalProtos'
}

protobuf {
	protoc {
		artifact = "com.google.protobuf:protoc:${protobufVersion}"
	}
	plugins {
		grpc {
			artifact = "io.grpc:protoc-gen-grpc-java:${grpcVersion}"
		}
	}
	generateProtoTasks {
		all()*.plugins {
			grpc {}
		}
	}
}

openApiGenerate {
	generatorName = 'spring'
	inputSpec = "$rootDir/../contracts/openapi.yaml".toString()
	outputDir = layout.buildDirectory.dir("generated/openapi").get().asFile.toString()
	apiPackage = 'ats.api'
	modelPackage = 'ats.gateway.model'
	configOptions = [
		interfaceOnly: 'true',
		useSpringBoot4: 'true',
		useJakartaEe: 'true',
		useTags: 'true',
		skipDefaultInterface: 'true',
		openApiNullable: 'false',
		useBeanValidation: 'true',
		performBeanValidation: 'true',
		dateLibrary: 'java8',
		serializationLibrary: 'jackson',
		documentationProvider: 'none',
		annotationLibrary: 'none'
	]
	globalProperties = [
		apis: '',
		models: ''
	]
}

sourceSets.main.java.srcDir layout.buildDirectory.dir("generated/openapi/src/main/java")

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-liquibase'
	implementation 'ats:text-extraction'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.2.0'
	implementation 'org.springframework.grpc:spring-grpc-client-spring-boot-starter'
	implementation 'org.springframework.grpc:spring-grpc-server-spring-boot-starter'
	implementation 'org.springframework.ai:spring-ai-openai'
	implementation 'org.springframework.ai:spring-ai-pdf-document-reader'
	implementation 'com.openai:openai-java-client-okhttp:4.49.0'
	implementation 'org.openapitools:jackson-databind-nullable:0.2.10'
	implementation 'org.mapstruct:mapstruct:1.6.3'
	implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
	implementation 'io.jsonwebtoken:jjwt-impl:0.13.0'
	implementation 'io.jsonwebtoken:jjwt-jackson:0.13.0'

	implementation "com.google.protobuf:protobuf-java:${protobufVersion}"
	implementation "io.grpc:grpc-protobuf:${grpcVersion}"
	implementation "io.grpc:grpc-stub:${grpcVersion}"
	implementation "io.grpc:grpc-netty-shaded:${grpcVersion}"
	implementation 'javax.annotation:javax.annotation-api:1.3.2'

	implementation "software.amazon.awssdk:s3:${awsSdkVersion}"
	implementation "com.microsoft.onnxruntime:onnxruntime:${onnxRuntimeVersion}"
	implementation "ai.djl.huggingface:tokenizers:${djlVersion}"
	implementation "com.googlecode.libphonenumber:libphonenumber:${libphonenumberVersion}"

	runtimeOnly 'org.postgresql:postgresql'
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-docker-compose'
	developmentOnly 'org.springframework.ai:spring-ai-spring-boot-docker-compose'
	annotationProcessor 'org.projectlombok:lombok'
	annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-liquibase'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.springframework.ai:spring-ai-spring-boot-testcontainers'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.testcontainers:testcontainers-postgresql'
	testImplementation "io.grpc:grpc-inprocess:${grpcVersion}"
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testCompileOnly 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.grpc:spring-grpc-dependencies:${springGrpcVersion}"
		mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
		mavenBom "io.grpc:grpc-bom:${grpcVersion}"
	}
}

tasks.named('compileJava') {
	dependsOn tasks.named('openApiGenerate')
	options.compilerArgs += ['-parameters']
}

tasks.named('compileTestJava') {
	options.compilerArgs += ['-parameters']
}

tasks.named('processTestResources') {
	// Тесты поднимают схему тем же changelog, что и прод, но берут его из classpath.
	from("$rootDir/../migrations") {
		include 'db.changelog-master.yaml'
		include 'changes/**'
		into 'db/changelog'
	}
}

tasks.named('test') {
	useJUnitPlatform()
}

spotless {
	java {
		target 'src/**/*.java'
		importOrder()
		removeUnusedImports()
		googleJavaFormat('1.36.1').aosp()
	}
}
